# Configurations for `sift eval --matrix` (design §13.4): each task on its recommended tier, and
# describe/update one tier up (they are recommended on mid), to check the cheaper tier still holds. describe-lite and context-check are already
# on the small tier. Tiers map to models through packages/core/models/<provider>.yaml.
configs:
  - name: recommended
    tasks: {}
  - name: describe-on-frontier
    tasks: { describe: frontier, update: frontier }
